server {
    listen ${WEB_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compress text, including the TCC data bundle. SSE must not be buffered.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Host networking uses loopback (no Docker DNS needed). Keep deferred
    # resolution for bridge deployments that set BACKEND_HOST=backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream ${BACKEND_HOST}:${BACKEND_PORT};

    location /run_code/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # Astro fingerprints these files, so they are safe to cache indefinitely.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }

    # TCC artifacts have stable names: revalidate after a new deployment.
    location /tcc/ {
        try_files $uri =404;
        expires -1;
    }

    location /metrics {
        proxy_pass http://$backend_upstream;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }
}
