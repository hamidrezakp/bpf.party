# Static server for the generated Jekyll site (blog.bpflab.ir). Mirrors
# docker/nginx.conf's unprivileged nginx (port 8080), minus the API proxying:
# this is pure static content.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compress text; the Atom feed, sitemap, and SVG images benefit too.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/atom+xml application/rss+xml;

    charset utf-8;

    # Directory redirects (extensionless permalink → trailing slash) must stay
    # relative: absolute_redirect would emit this container's listen port
    # (8080), which is wrong whenever the published port differs or a proxy
    # terminates TLS in front of nginx.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Fully static blog: styles from the site and Google Fonts, avatars from
    # Gravatar; everything else is a plain link, and jekyll-seo-tag's JSON-LD
    # is a non-executable data block, so no script-src is needed. Posts
    # embedding resources from new origins must extend this policy.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://secure.gravatar.com; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Advertise the correct type; an empty types{} is needed because the
    # inherited mime.types map would otherwise keep .xml as text/xml.
    location = /feed.xml {
        types { }
        default_type application/atom+xml;
    }

    # Jekyll's generated 404 page, served with a real 404 status. `internal`
    # keeps direct requests to /404.html from being treated as content.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Jekyll does not fingerprint asset names, so nothing here is safe to
    # cache blindly; revalidate every response and let unchanged files
    # answer with 304.
    expires -1;

    # Permalinks are directories (.../title/index.html); the canonical URL
    # has a trailing slash and the extensionless form redirects to it.
    location / {
        try_files $uri $uri/ =404;
    }
}
