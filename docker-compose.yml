# Variable defaults are read from a root `.env` file (see .env.example):
# listening ports, hugepages, and backend build versions can be overridden
# without editing this file. Web/blog toolchain build args (EMSDK_VERSION,
# NODE_VERSION, NGINX_VERSION, RUBY_VERSION) default inside the Dockerfiles
# and can be overridden with `docker compose build --build-arg KEY=VALUE`.

services:
  backend:
    image: bpflab/backend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        FC_VERSION: ${FC_VERSION:-v1.16.1}
        KERNEL_VERSION: ${KERNEL_VERSION:-6.18.2}
    # privileged instead of Compose sysctls: vm.nr_hugepages is not
    # namespaced, so Docker rejects `sysctls:` for it. The entrypoint
    # allocates the hugepages itself (REQUIRED_HUGEPAGES, default 128 pages
    # for max_concurrent_vms = 4) and needs cgroup/KVM access for the VMs.
    privileged: true
    network_mode: host
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    # All services share the host network. The backend binds loopback only;
    # nginx proxies /run_code/ and /metrics to it on BACKEND_PORT.
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8081}
      REQUIRED_HUGEPAGES: ${REQUIRED_HUGEPAGES:-128}
    restart: unless-stopped

  web:
    image: bpflab/web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.website
    network_mode: host
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
      BACKEND_HOST: ${BACKEND_HOST:-127.0.0.1}
      BACKEND_PORT: ${BACKEND_PORT:-8081}
    restart: unless-stopped

  blog:
    image: bpflab/blog:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.blog
    network_mode: host
    # Independent of backend/web; 4000 matches `make blog-dev`.
    environment:
      BLOG_PORT: ${BLOG_PORT:-4000}
    restart: unless-stopped
